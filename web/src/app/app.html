<main
  class="min-h-screen bg-[#f6f8fa] dark:bg-[#010409] text-neutral-900 dark:text-neutral-100 font-sans transition-colors duration-200 flex flex-col relative pb-20 sm:pb-0 z-0 overflow-hidden">

  <!-- Subtle Ambient Glow (Light Mode: Top Corona) -->
  <div class="dark:hidden absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-64 bg-gradient-to-br from-blue-500/20 via-teal-500/10 to-transparent blur-3xl -z-10 pointer-events-none opacity-70"></div>
  
  <!-- Subtle Ambient Glow (Dark Mode: Bottom Glow) -->
  <div class="hidden dark:block fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-64 bg-gradient-to-t from-blue-500/20 via-teal-500/10 to-transparent blur-3xl -z-10 pointer-events-none opacity-75"></div>

  <!-- CABECERA ADAPTATIVA: Minimalista en Móvil, Flotante en Escritorio -->
  <header class="sticky top-0 z-40 sm:pt-6 sm:px-6 pointer-events-none">

    <!-- Contenedor interior: Fondo transparente y bordes limpios -->
    <div
      class="pointer-events-auto flex items-center justify-between px-6 py-4 sm:py-3 sm:px-5 sm:max-w-6xl sm:mx-auto sm:rounded-lg sm:border sm:border-neutral-200 dark:sm:border-neutral-800 sm:bg-transparent transition-colors">

      <!-- Logo Técnico -->
      <div class="flex items-center gap-4">
        <h1
          class="text-xl font-bold tracking-tight text-neutral-900 dark:text-white drop-shadow-sm sm:drop-shadow-none">
          INVERSOR<span class="text-neutral-900 dark:text-white">_</span>
        </h1>
      </div>

      <!-- Minimal Desktop Nav -->
      <nav class="hidden sm:flex items-center gap-6 text-sm font-medium ml-8 mr-auto">
        <a class="text-neutral-900 dark:text-white cursor-pointer hover:opacity-80 transition-opacity">Work</a>
        <a class="text-neutral-500 hover:text-neutral-900 dark:hover:text-white cursor-pointer transition-colors">History</a>
        <a class="text-neutral-500 hover:text-neutral-900 dark:hover:text-white cursor-pointer transition-colors">Profile</a>
      </nav>

      <!-- Controles Superiores -->
      <div class="flex items-center gap-4">
        <!-- Theme Toggle -->
        <button (click)="themeService.toggleTheme()"
          class="p-2 sm:p-0 rounded-full sm:rounded-none bg-transparent dark:bg-transparent sm:bg-transparent dark:sm:bg-transparent backdrop-blur-none sm:backdrop-blur-none border border-neutral-200 dark:border-neutral-800 sm:border-none text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white transition-colors">
          <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
        <!-- Desktop Avatar (Oculto en Móvil, se muda al Bottom Bar) -->
        <div
          class="hidden sm:flex h-7 w-7 rounded bg-neutral-100 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 items-center justify-center text-xs font-mono font-bold text-neutral-900 dark:text-neutral-100 cursor-pointer hover:bg-neutral-200 dark:hover:bg-neutral-800 transition-colors">
          US
        </div>
      </div>

    </div>
  </header>

  <!-- ÁREA CENTRAL DE TRABAJO -->
  <section class="max-w-6xl mx-auto px-6 py-4 sm:py-8 w-full flex-grow">
    <router-outlet></router-outlet>
  </section>

  <!-- BOTTOM NAVIGATION BAR (Solo Móvil) -->
  <nav
    class="sm:hidden fixed bottom-6 left-4 right-4 z-50 rounded-full bg-white/60 dark:bg-white/5 backdrop-blur-xl border border-transparent pb-0">
    <div class="flex justify-around items-center h-16 px-4">

      <!-- Tab 1: Workspace (Activo) -->
      <button class="flex flex-col items-center justify-center w-full h-full text-slate-700 dark:text-slate-300">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        <span class="text-[10px] font-medium tracking-wide">Work</span>
      </button>

      <!-- Tab 2: Historial (Inactivo) -->
      <button
        class="flex flex-col items-center justify-center w-full h-full text-neutral-500 dark:text-neutral-500 hover:text-neutral-900 dark:hover:text-white transition-colors">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-[10px] font-medium tracking-wide">History</span>
      </button>

      <!-- Tab 3: Perfil (Inactivo) -->
      <button
        class="flex flex-col items-center justify-center w-full h-full text-neutral-500 dark:text-neutral-500 hover:text-neutral-900 dark:hover:text-white transition-colors">
        <svg class="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="text-[10px] font-medium tracking-wide">Profile</span>
      </button>

    </div>
  </nav>
</main>
